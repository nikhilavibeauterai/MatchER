name: Desktop release
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft preview release after both builds pass
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} x64
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.lock
            packaging/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            tests/ui/package-lock.json
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1 libopengl0 libportaudio2 libgtk-3-0 libnss3 libasound2 libgbm1 xvfb
      - name: Install checked Python dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --require-hashes -r packaging/requirements.lock
      - name: Check versions
        shell: bash
        run: |
          python -c "import json; from matcher import __version__; assert json.load(open('desktop/package.json'))['version'] == __version__"
          python -c "from matcher import __version__; print('MATCHER_VERSION=' + __version__)" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python -c "import os; from matcher import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__"
          fi
      - name: Freeze backend
        run: python scripts/build_backend.py
      - name: Smoke-test Linux backend and public sample analysis
        if: runner.os == 'Linux'
        run: python scripts/smoke_backend.py dist/backend/matcher-backend/matcher-backend --analyze
      - name: Smoke-test Windows backend and public sample analysis
        if: runner.os == 'Windows'
        run: python scripts/smoke_backend.py dist/backend/matcher-backend/matcher-backend.exe --analyze
      - name: Test application
        run: python -m pytest -q
      - name: Install checked desktop dependencies
        run: |
          npm ci --prefix desktop
          npm ci --prefix tests/ui
          npm test --prefix desktop
      - name: Build installers
        run: npm run dist --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke-test packaged Linux window
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke_desktop.cjs
        env:
          MATCHER_DESKTOP: ${{ github.workspace }}/dist/desktop/linux-unpacked/matcher
      - name: Smoke-test packaged Windows window
        if: runner.os == 'Windows'
        run: node scripts/smoke_desktop.cjs
        env:
          MATCHER_DESKTOP: ${{ github.workspace }}\dist\desktop\win-unpacked\MatchER.exe
      - name: Write checksums
        run: python scripts/checksums.py
      # The installer is exercised separately from the unpacked app.
      - name: Install, launch and uninstall on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/desktop/MatchER-*.exe | Select-Object -First 1
          $install = Join-Path $env:RUNNER_TEMP 'MatchER-installed'
          $process = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          $env:MATCHER_DESKTOP = Join-Path $install 'MatchER.exe'
          node scripts/smoke_desktop.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke test failed' }
          $uninstaller = Get-ChildItem $install -Filter 'Uninstall*.exe' | Select-Object -First 1
          $process = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited $($process.ExitCode)" }
      - name: Smoke-test portable Linux AppImage
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke_desktop.cjs
        env:
          MATCHER_DESKTOP: ${{ github.workspace }}/dist/desktop/MatchER-${{ env.MATCHER_VERSION }}-linux-x64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - uses: actions/upload-artifact@v7
        with:
          name: MatchER-${{ runner.os }}-x64
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/*.exe
            dist/desktop/SHA256SUMS-*.txt

  draft:
    name: Draft a tagged release
    if: github.ref_type == 'tag' || inputs.draft_release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: MatchER-*
          merge-multiple: true
          path: installers
      - name: Create draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$(node -p "'v' + require('./desktop/package.json').version")"
          gh release create "$TAG" installers/* --target "$GITHUB_SHA" --draft --prerelease --title "MatchER $TAG preview" --generate-notes
