name: Desktop release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} x64
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.lock
            packaging/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            tests/ui/package-lock.json
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libportaudio2 libgtk-3-0 libnss3 libasound2 libgbm1 xvfb
      - name: Install checked Python dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --require-hashes -r packaging/requirements.lock
      - name: Test application
        run: python -m pytest -q
      - name: Install checked desktop dependencies
        run: |
          npm ci --prefix desktop
          npm ci --prefix tests/ui
          npm test --prefix desktop
      - name: Check versions
        shell: bash
        run: |
          python -c "import json; from matcher import __version__; assert json.load(open('desktop/package.json'))['version'] == __version__"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python -c "import os; from matcher import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__"
          fi
      - name: Freeze backend
        run: python scripts/build_backend.py
      - name: Smoke-test Linux backend and public sample analysis
        if: runner.os == 'Linux'
        run: python scripts/smoke_backend.py dist/backend/matcher-backend/matcher-backend --analyze
      - name: Smoke-test Windows backend and public sample analysis
        if: runner.os == 'Windows'
        run: python scripts/smoke_backend.py dist/backend/matcher-backend/matcher-backend.exe --analyze
      - name: Build installers
        run: npm run dist --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke-test packaged Linux window
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke_desktop.cjs
        env:
          MATCHER_DESKTOP: ${{ github.workspace }}/dist/desktop/linux-unpacked/matcher
      - name: Smoke-test packaged Windows window
        if: runner.os == 'Windows'
        run: node scripts/smoke_desktop.cjs
        env:
          MATCHER_DESKTOP: ${{ github.workspace }}\dist\desktop\win-unpacked\MatchER.exe
      - name: Write checksums
        run: python scripts/checksums.py
      - uses: actions/upload-artifact@v7
        with:
          name: MatchER-${{ runner.os }}-x64
          if-no-files-found: error
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/*.exe
            dist/desktop/SHA256SUMS-*.txt

  draft:
    name: Draft a tagged release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: MatchER-*
          merge-multiple: true
          path: installers
      - name: Create draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" installers/* --verify-tag --draft --prerelease --title "MatchER $TAG preview" --generate-notes
